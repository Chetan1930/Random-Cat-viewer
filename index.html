<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <h1>Random Cat Viewer</h1>
            <p>Fetch a new cat image each time you click the button.</p>
            <div class="stats">
                <span id="cat-counter">Cats viewed: 0</span>
                <button id="view-favorites-button" class="secondary-button header-button">View Favorites</button>
            </div>
        </header>

        <section class="card">
            <div class="cat-frame">
                <img id="cat-image" src="" alt="Random cat" />
                <div id="loading" class="loading">Loading cat...</div>
            </div>

            <div class="cat-details">
                <p id="cat-id">Cat ID: —</p>
                <p id="cat-breed" class="secondary"></p>
                <p id="cat-description" class="secondary"></p>
            </div>

            <div class="button-group">
                <button id="favorite-button" type="button" class="secondary-button">❤️ Favorite</button>
                <button id="new-cat-button" type="button">Show another cat</button>
            </div>
        </section>

        <section id="favorites-section" class="favorites-section hidden">
            <h2>Your Favorite Cats</h2>
            <div id="favorites-grid" class="favorites-grid">
                <!-- Favorites will be populated here -->
            </div>
            <button id="close-favorites-button" class="secondary-button">Close Favorites</button>
        </section>
    </main>

    <script src="logic.js"></script>
</body>
</html>
